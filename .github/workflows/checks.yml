name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-safe:
    name: Windows safe checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run safe checks as a standard Windows user
        shell: powershell
        run: ./Checks/Run-CiChecks.ps1
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-safe-evidence
          path: |
            dist/security/
            dist/ci/
            dist/HytaleAccounts-Setup.zip
            dist/SHA256SUMS.txt
            dist/SECURITY-STATUS.json
          if-no-files-found: warn
          retention-days: 14
